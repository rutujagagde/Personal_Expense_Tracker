<div class="auth-wrapper">
    <div class="auth-card">

        <div class="auth-header">
            <div class="auth-icon">✨</div>
            <h2>Create account</h2>
            <p>Start tracking your income & expenses</p>
        </div>

        <form [formGroup]="user" (ngSubmit)="registerSubmit()">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input id="name" type="text" formControlName="name" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" type="email" formControlName="email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" placeholder="Min. 6 characters" formControlName="password"
                    required>
            </div>

            <div class="form-group">
                <label for="confirm">Confirm Password</label>
                <input id="confirm" type="password" formControlName="confirm" required>
            </div>

            <button class="btn-primary" type="submit">
                Register
            </button>

        </form>

        <p class="auth-footer">
            Already have an account?
            <a routerLink="/login">Login here</a>
        </p>

    </div>
</div>
