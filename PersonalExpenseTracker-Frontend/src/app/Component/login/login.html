<div class="auth-wrapper">
    <div class="auth-card">

        <div class="auth-header">
            <div class="auth-icon">🔐</div>
            <h2>Welcome Back!</h2>
            <p>Login to manage your income and expenses</p>
        </div>

        <form [formGroup]="user_data" (ngSubmit)="loginSubmit()">

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email Address</label>

                <input type="email" id="email" formControlName="email" placeholder="Enter your email"
                    autocomplete="email" (input)="filterEmail($event)" />

                <small class="text-danger" *ngIf="f['email'].touched && f['email'].errors?.['required']">
                    Email is required.
                </small>

                <small class="text-danger" *ngIf="f['email'].touched && f['email'].errors?.['email']">
                    Please enter a valid email address.
                </small>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>

                <input type="password" id="password" formControlName="password" placeholder="Enter your password"
                    autocomplete="current-password" />

                <small class="text-danger" *ngIf="f['password'].touched && f['password'].errors?.['required']">
                    Password is required.
                </small>

                <small class="text-danger" *ngIf="f['password'].touched && f['password'].errors?.['minlength']">
                    Password must contain at least 6 characters.
                </small>
            </div>

            <!-- Error Message -->
            <div class="alert alert-danger" *ngIf="errorMessage">
                {{ errorMessage }}
            </div>

            <!-- Login Button -->
            <button type="submit" class="btn btn-primary w-100" [disabled]="loading">

                {{ loading ? 'Logging in...' : 'Login' }}

            </button>

        </form>

        <!-- Register Link -->
        <div class="auth-footer">
            <p>
                Don't have an account?
                <a routerLink="/register">Create Account</a>
            </p>
        </div>

    </div>
</div>
